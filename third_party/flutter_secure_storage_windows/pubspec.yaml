name: flutter_secure_storage_windows
description: >-
  Windows implementation of flutter_secure_storage, vendored to drop the
  ATL-based native compatibility layer (see lib/README.md in this directory).
repository: https://github.com/mogol/flutter_secure_storage
version: 4.2.2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  win32: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_windows: ^2.0.0
  very_good_analysis: ^7.0.0

# 与上游唯一的差异：删掉 `pluginClass: FlutterSecureStorageWindowsPlugin`。
#
# 上游的 Windows 实现有两套后端：
#   1. Dart + win32 FFI 的 DPAPI JSON 文件存储（默认走这条）；
#   2. C++/ATL 的「向后兼容」方法通道，只在 useBackwardCompatibility=true 时用。
# 第 2 条让构建必须装 VS 的 ATL 组件（atlstr.h），否则 `flutter build windows`
# 直接 C1083。本项目没有历史数据要迁移，WindowsOptions 默认就是 false，
# 所以只留 Dart 实现：去掉 pluginClass 后不再编译任何 C++，构建零 ATL 依赖。
flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
