# 8GB 内存的机器上，模板默认的 -Xmx8G 会让 JVM 直接 malloc 失败，
# 这里收到够用又不炸的档位；内存更大的机器可以自行调高。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseSerialGC

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
