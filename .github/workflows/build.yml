# 构建并发布 Android APK。
#
# 触发：推 tag（v*）或手动 workflow_dispatch。
#
# 用到的仓库 secret（不配置也能跑，只是产物会退化成 debug 签名，
# 和本地 release 签名的包无法互相覆盖升级）：
#   ANDROID_KEYSTORE_BASE64  release.jks 的 base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore keystore (optional)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "no keystore secret -> release APK falls back to debug signing"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KS_B64" | base64 -d > android/keystore/release.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/release.jks"
          } > android/key.properties

      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk

  # 推 tag 时把 APK 挂到 Release。
  #
  # 这是**唯一的**分发渠道：README 里写明了本项目提供什么（源码 + 构建产物）
  # 和不提供什么（不上架应用商店、不接受商业分发、不承载他人内容）。
  release:
    needs: [android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
