// Gradle 全局镜像（放在 GRADLE_USER_HOME/init.d/ 下自动生效）
//
// 作用：把仓库里的 repo.maven.apache.org / dl.google.com 换成阿里云镜像。
// 国内直连 Maven Central 常常"看着没反应"，就是卡在下载上。
//
// 注意：工程可能配置了 "prefer settings repositories"，此时往 project 级仓库
// 塞东西会直接报错，所以只按当前模式往对应层级加。

def mirrors = [
  'https://maven.aliyun.com/repository/public',
  'https://maven.aliyun.com/repository/google',
  'https://maven.aliyun.com/repository/gradle-plugin'
]

def blocked = ['repo.maven.apache.org', 'repo1.maven.org', 'dl.google.com', 'jcenter.bintray.com']

def redirect = { repos ->
  def toRemove = []
  repos.each { repo ->
    try {
      if (repo.hasProperty('url')) {
        def u = repo.url.toString()
        if (blocked.any { u.contains(it) }) { toRemove << repo }
      }
    } catch (ignored) { }
  }
  toRemove.each { repos.remove(it) }

  def existing = repos.collect { it.name } as Set
  mirrors.each { m ->
    if (!existing.contains(m)) {
      repos.maven { url = m; name = m }
    }
  }
}

def preferSettings = false

settingsEvaluated { settings ->
  try { redirect(settings.pluginManagement.repositories) } catch (ignored) { }
  try {
    redirect(settings.dependencyResolutionManagement.repositories)
    preferSettings =
        settings.dependencyResolutionManagement.repositoriesMode.get().toString() == 'PREFER_SETTINGS'
  } catch (ignored) { }
}

allprojects { p ->
  redirect(p.buildscript.repositories)
  if (!preferSettings) {
    redirect(p.repositories)
  }
}
